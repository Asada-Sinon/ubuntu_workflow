#  ═══════════════════════════════════════════════════════════════
#  ~/.tmux.conf
#  配色 Gruvbox Dark，与 zsh / starship / bat / btop / delta 一致
#  不依赖 tpm —— 状态栏是手写的，`tmux source ~/.tmux.conf` 即刻生效
#  ═══════════════════════════════════════════════════════════════

# ── 前缀键 ──────────────────────────────────────────────────────
# 默认 C-b 和 emacs 的「前移一字符」冲突（.zshrc 里 bindkey -e）
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # 按两下 C-a 把它送进内层程序

# ── 基础行为 ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# 真彩色。ghostty / gnome-terminal 都支持
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc,*256col*:Tc"

set -g mouse on               # 滚轮翻页、点击切 pane、拖边框改大小
set -g history-limit 100000   # 与 .zshrc 的 HISTSIZE 对齐
set -sg escape-time 10        # 默认 500ms，会让 vim/zsh 里的 ESC 卡顿
set -g repeat-time 600
set -g focus-events on
set -g display-time 2000

# 窗口/pane 从 1 开始编号，关掉中间的窗口后自动重排
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S ▸ #W"
setw -g automatic-rename on
setw -g mode-keys vi
setw -g status-keys emacs

# ── 快捷键 ──────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "已重载 ~/.tmux.conf"

# 分屏：| 竖切，- 横切，都继承当前目录（tmux 默认不继承，很反直觉）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
unbind '"'
unbind %

# pane 间移动：Alt+方向键，无需前缀
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# 调整 pane 大小：前缀 + HJKL（可重复按）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 复制模式：v 开始选择、y 复制（vi 风格）
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── 配色：Gruvbox Dark ──────────────────────────────────────────
# bg0 #282828  bg0_h #1d2021  bg1 #3c3836  bg2 #504945
# fg1 #ebdbb2  fg3 #bdae93  gray #928374
# purple #d3869b  blue #83a598  green #b8bb26  orange #fe8019  red #fb4934
set -g status-style              "bg=#282828,fg=#ebdbb2"
set -g status-position           bottom
set -g status-interval           5
set -g status-justify            left

set -g message-style             "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style     "bg=#3c3836,fg=#ebdbb2"

set -g pane-border-style         "fg=#3c3836"
set -g pane-active-border-style  "fg=#d3869b"
setw -g mode-style               "bg=#504945,fg=#ebdbb2"

# 左：session 名
set -g status-left-length 40
set -g status-left "#[bg=#d3869b,fg=#282828,bold]  #S #[bg=#282828,fg=#d3869b]"

# 右：主机名 + 时间
set -g status-right-length 60
set -g status-right "#[fg=#3c3836]#[bg=#3c3836,fg=#bdae93] #h #[fg=#83a598,bg=#3c3836]#[bg=#83a598,fg=#282828,bold] %m-%d %H:%M "

# 窗口标签
setw -g window-status-format         "#[fg=#928374] #I #W "
setw -g window-status-current-format "#[fg=#282828,bg=#fe8019]#[bg=#fe8019,fg=#282828,bold] #I #W #[fg=#fe8019,bg=#282828]"
setw -g window-status-separator      ""
setw -g window-status-bell-style     "fg=#fb4934,bold"
