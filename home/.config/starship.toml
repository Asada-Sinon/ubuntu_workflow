#  ─────────────────────────────────────────────────────────────
#  Starship — Catppuccin Mocha Powerline
#  需要 Nerd Font（已装：IosevkaTermSlab / Monaspice / JetBrainsMono）
#  改配色：把 palette 改成 catppuccin_macchiato / frappe / latte
#  ─────────────────────────────────────────────────────────────

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](bg:green fg:peach)\
$git_branch\
$git_status\
[](fg:green bg:teal)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:teal bg:blue)\
$docker_context\
$conda\
[](fg:blue bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'
add_newline = true

[os]
disabled = false
style = "bg:surface0 fg:text"
format = '[ $symbol]($style)'

[os.symbols]
Ubuntu = "󰕈"
Debian = "󰣚"
Arch = "󰣇"
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"
Linux = "󰌽"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red bold"
format = '[ $user ]($style)'

[directory]
style = "fg:crust bg:peach bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Videos"    = " "
"Developer" = "󰲋 "
"Desktop"   = " "
"projects"  = "󰲋 "
".config"   = " "

[git_branch]
symbol = ""
style = "bg:green"
format = '[[ $symbol $branch ](fg:crust bg:green)]($style)'

[git_status]
style = "bg:green"
format = '[[($all_status$ahead_behind )](fg:crust bg:green)]($style)'
conflicted = "󰞇 "
ahead      = "󰜷 ${count}"
behind     = "󰜮 ${count}"
diverged   = "󰃻 ${ahead_count}󰜮${behind_count}"
untracked  = "󰋗 ${count}"
stashed    = " ${count}"
modified   = "󰏫 ${count}"
staged     = " ${count}"
renamed    = "󰑕 ${count}"
deleted    = "󰆴 ${count}"

# ── 语言版本（进了对应项目目录才显示）────────────────────────
[nodejs]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[python]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version)( \($virtualenv\)) ](fg:crust bg:teal)]($style)'

[rust]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[golang]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[java]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[kotlin]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[haskell]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[php]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:crust bg:teal)]($style)'

[docker_context]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $context) ](fg:crust bg:blue)]($style)'
only_with_files = true

[conda]
symbol = "󰌠"
style = "bg:blue"
format = '[[ $symbol( $environment) ](fg:crust bg:blue)]($style)'
ignore_base = true

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[ 󰥔 $time ](fg:crust bg:lavender)]($style)'

# ── 耗时超过 2s 的命令自动显示用时 ──────────────────────────
[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = '[ 󱎫 $duration]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold lavender)'

