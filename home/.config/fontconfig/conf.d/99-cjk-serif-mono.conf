<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  终端里让中文走衬线：霞鹜文楷 LXGW WenKai Mono

  只对下面三款终端拉丁字体生效（它们都不含汉字，所以中文必然回退）。
  刻意不去动通用的 monospace —— 那样会把其它程序的拉丁字形也换成楷体。

  想换成宋体：把下面的 "LXGW WenKai Mono" 全改成 "Noto Serif CJK SC"
  改完执行  fc-cache -f  ，重开终端生效。

  Ghostty 不依赖本文件，它在 ~/.config/ghostty/config 里用多行
  font-family 显式指定回退链，改字体记得两边一起改。
-->
<fontconfig>

  <match target="pattern">
    <test name="family"><string>IosevkaTermSlab Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>MonaspiceXe Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>CodeNewRoman Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

</fontconfig>
