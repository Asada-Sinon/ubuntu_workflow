## atuin — shell 历史数据库
## 默认纯本地；要跨机同步再跑 `atuin register` / `atuin login`
auto_sync = false
update_check = false
sync_frequency = "10m"

## 搜索
search_mode = "fuzzy"          # prefix | fulltext | fuzzy | skim
filter_mode = "global"         # global | host | session | directory
filter_mode_shell_up_key_binding = "session"
workspaces = true              # 在 git 仓库里自动按项目过滤

## 界面
style = "compact"              # full | compact | auto
inline_height = 25
show_preview = true
show_help = true
show_tabs = true
invert = false
prefers_reduced_motion = false

## 行为
enter_accept = true            # 回车直接执行选中项
keymap_mode = "emacs"
secrets_filter = true          # 自动过滤疑似密钥的命令
history_filter = [
  "^\\s",                      # 空格开头的命令不记录
  "^(pass|gopass)\\s",
  "AWS_SECRET_ACCESS_KEY",
  "^export .*(TOKEN|SECRET|PASSWORD|KEY)=",
]

[stats]
common_prefix = ["sudo", "time", "env"]
